name: Full Test & Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: full-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff quality gate
        run: ruff check .

      - name: Python syntax validation
        run: python -m compileall config.py factory.py extensions.py admin models routes services utils forms

      - name: Frontend JavaScript syntax validation
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          js_files = sorted(Path('static/js').glob('*.js'))
          if not js_files:
              raise SystemExit('No frontend JS files were found in static/js')

          for js_file in js_files:
              subprocess.run(['node', '--check', str(js_file)], check=True)
          PY

  tests-sqlite:
    name: SQLite suite + coverage
    runs-on: ubuntu-latest
    needs: static-analysis
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-secret-key
      USE_TEST_DB: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run full pytest suite (SQLite/default config)
        run: |
          pytest -q \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 30

  tests-postgres:
    name: PostgreSQL integration suite
    runs-on: ubuntu-latest
    needs: static-analysis
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-secret-key
      RUN_WITH_REAL_DB: "true"
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      PG_CONNECT_TIMEOUT: 10
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import os, time
          import psycopg2
          url = os.environ['DATABASE_URL']
          for attempt in range(30):
              try:
                  psycopg2.connect(url)
                  print('PostgreSQL is ready')
                  break
              except Exception as exc:
                  if attempt == 29:
                      raise
                  print(f'waiting for postgres ({attempt + 1}/30): {exc}')
                  time.sleep(2)
          PY

      - name: Run full pytest suite on PostgreSQL
        run: pytest -q --tb=short

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Audit project dependencies
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          reqs = data['project']['dependencies']
          temp = Path('.github/deps-audit.txt')
          temp.write_text('\n'.join(reqs) + '\n', encoding='utf-8')
          PY
          pip-audit -r .github/deps-audit.txt --strict
