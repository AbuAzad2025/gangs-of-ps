name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'static/adminlte/**'
      - 'static/**/*.svg'
      - 'static/**/*.png'
      - 'static/**/*.jpg'
      - 'static/**/*.jpeg'
      - 'static/**/*.ico'
      - 'static/**/*.woff'
      - 'static/**/*.woff2'
      - 'static/**/*.ttf'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'static/adminlte/**'
      - 'static/**/*.svg'
      - 'static/**/*.png'
      - 'static/**/*.jpg'
      - 'static/**/*.jpeg'
      - 'static/**/*.ico'
      - 'static/**/*.woff'
      - 'static/**/*.woff2'
      - 'static/**/*.ttf'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONPATH: .

jobs:
  lint-and-static:
    name: Lint + static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: pip install -e '.[dev]'

      - name: Ruff quality gate
        run: ruff check .

      - name: Python syntax validation
        run: python -m compileall config.py factory.py extensions.py admin models routes services utils forms

      - name: Frontend JavaScript syntax validation
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          js_files = sorted(Path('static/js').glob('*.js'))
          if not js_files:
              raise SystemExit('No frontend JavaScript files were found in static/js')

          for js_file in js_files:
              subprocess.run(['node', '--check', str(js_file)], check=True)
          PY

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: lint-and-static
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-secret-key
      USE_TEST_DB: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: pip install -e '.[dev]'

      - name: Prepare test output directories
        run: mkdir -p test-results coverage

      - name: Run pytest with coverage
        run: |
          pytest -q -m "not e2e" \
            --tb=short \
            --junitxml=test-results/unit-junit.xml \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage/unit-coverage.xml \
            --cov-report=json:coverage/unit-coverage.json \
            --cov-report=html:htmlcov/unit

      - name: Write coverage summary
        run: |
          python -m coverage report -m --data-file=.coverage > test-results/unit-coverage-summary.txt || true

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            test-results/unit-junit.xml
            test-results/unit-coverage-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: |
            coverage/unit-coverage.xml
            coverage/unit-coverage.json
            htmlcov/unit/
          if-no-files-found: error
          retention-days: 30

  e2e-smoke:
    name: E2E smoke flow
    runs-on: ubuntu-latest
    needs: lint-and-static
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-secret-key
      USE_TEST_DB: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: pip install -e '.[dev]'

      - name: Prepare test output directories
        run: mkdir -p test-results

      - name: Run E2E smoke tests
        run: |
          pytest -q -m e2e \
            --tb=short \
            --junitxml=test-results/e2e-junit.xml

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/e2e-junit.xml
          if-no-files-found: error
          retention-days: 30

  postgres-tests:
    name: PostgreSQL integration suite
    runs-on: ubuntu-latest
    needs: lint-and-static
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-secret-key
      RUN_WITH_REAL_DB: 'true'
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      PG_CONNECT_TIMEOUT: '10'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: pip install -e '.[dev]'

      - name: Prepare test output directories
        run: mkdir -p test-results

      - name: Wait for PostgreSQL readiness
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg2

          url = os.environ['DATABASE_URL']
          for attempt in range(30):
              try:
                  psycopg2.connect(url)
                  print('PostgreSQL is ready')
                  break
              except Exception as exc:
                  if attempt == 29:
                      raise
                  print(f'Waiting for PostgreSQL ({attempt + 1}/30): {exc}')
                  time.sleep(2)
          PY

      - name: Run PostgreSQL pytest suite
        run: pytest -q -m "not e2e" --tb=short --junitxml=test-results/postgres-junit.xml

      - name: Upload PostgreSQL test results
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results
          path: test-results/postgres-junit.xml
          if-no-files-found: error
          retention-days: 30

  test-report:
    name: Publish test reports
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-smoke, postgres-tests]
    if: always()
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project dependencies
        run: pip install -e '.[dev]'

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: coverage

      - name: Download test result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results'
          path: test-results
          merge-multiple: true

      - name: Generate project-wide coverage dashboard
        run: |
          python tests/support/coverage_inventory.py \
            --backend-json coverage/unit-coverage.json \
            --e2e-xml test-results/e2e-junit.xml \
            --output-dir coverage/project-dashboard

      - name: Upload project-wide quality report
        uses: actions/upload-artifact@v4
        with:
          name: full-project-coverage
          path: |
            coverage/project-dashboard/project-coverage-dashboard.txt
            coverage/project-dashboard/project-coverage-dashboard.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish JUnit test results
        uses: dorny/test-reporter@v1
        with:
          name: Python test suite
          path: 'test-results/**/*.xml'
          reporter: java-junit
          fail-on-error: true

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-smoke, postgres-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install pip-audit

      - name: Audit project dependencies
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          reqs = data['project']['dependencies']
          temp = Path('.github/deps-audit.txt')
          temp.write_text('\n'.join(reqs) + '\n', encoding='utf-8')
          PY
          pip-audit -r .github/deps-audit.txt --strict
