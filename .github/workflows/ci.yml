name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint + static checks + app smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Ruff quality gate
        run: ruff check . --output-format=concise

      - name: Python compile smoke
        run: |
          python -m compileall \
            config.py factory.py extensions.py admin models routes services utils forms

      - name: App bootstrap smoke
        env:
          DATABASE_URL: sqlite:///ci-smoke.db
          SECRET_KEY: ci-secret
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from config import Config
          from factory import create_app
          app = create_app(Config)
          with app.app_context():
              print('APP_BOOTSTRAP_OK')
          PY

  database:
    name: DB migration + template integrity
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gangsofpalestine_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gangsofpalestine_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gangsofpalestine_ci
      SECRET_KEY: ci-secret
      PG_CONNECT_TIMEOUT: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run DB migration check
        run: python scripts/qa/run_db_upgrade.py

      - name: Verify migration state
        run: python scripts/qa/check_db_migrations.py

      - name: Check template integrity
        run: python scripts/check_integration.py

  tests:
    name: Full test suite + coverage
    runs-on: ubuntu-latest
    needs: [quality, database]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLASK_ENV: testing
      RUN_WITH_REAL_DB: "true"
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      PG_CONNECT_TIMEOUT: 10
      SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import os, time
          import psycopg2
          url = os.environ['DATABASE_URL']
          for attempt in range(30):
              try:
                  psycopg2.connect(url)
                  print('PostgreSQL is ready')
                  break
              except Exception as exc:
                  if attempt == 29:
                      raise
                  print(f'waiting for postgres ({attempt + 1}/30): {exc}')
                  time.sleep(2)
          PY

      - name: Run pytest with coverage
        run: |
          pytest -q \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Coverage inventory
        run: python tests/support/coverage_inventory.py

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage-by-file.txt
            htmlcov/
          if-no-files-found: error
          retention-days: 30

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import tomllib
          from pathlib import Path
          deps = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['dependencies']
          Path('deps-audit.txt').write_text('\n'.join(deps) + '\n', encoding='utf-8')
          PY
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r deps-audit.txt --strict
